<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corte Verde - Cadastro de Produtos</title>
  <link rel="stylesheet" href="/Madereira/static/lista.css" />
</head>
<body>



  <header class="appbar">
  <div class="nav-container">

    <!-- LOGO -->
    <div class="nav-left">
      <img src="/Madereira/static/img/ChatGPT Image 14 de nov. de 2025, 10_54_23.png" alt="Corte Verde" class="logo-nav">
    </div>

    <!-- MENU -->
    <nav class="nav-menu">
      <a href="#" class="nav-link active">Cadastro</a>
      <a href="#" class="nav-link">Produtos</a>
      <a href="#" class="nav-link">Pedidos</a>
      <a href="#" class="nav-link">User 056</a>
    </nav>

  </div>
</header>



  <!-- CONTAINER PRINCIPAL -->
  <main class="page-wrapper">
    <section class="products-card">
      <!-- Fundo com imagem e logo à esquerda -->
      

        <div class="card-right">
          <!-- Barra de colunas + botão -->
            <div class="list-header">
                <h3 class="titulo-card">Cadastro de Produtos</h3>

                <button id="btnNovoProduto" class="btn-primary">
                    + Novo produto
                </button>
            </div>


          <!-- Tabela gerada pelo cadastro -->
          <div class="table-wrapper">
            <table id="tabelaProdutos">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nome</th>
                  <th>Quantidade</th>
                  <th>Valor (R$)</th>
                </tr>
              </thead>
              <tbody>
                <!-- linhas geradas via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL DE CADASTRO -->
  <div class="modal-overlay" id="produtoModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Novo produto</h2>
        <button class="modal-close" id="fecharModal">×</button>
      </div>

      <form id="formProduto" class="modal-body">
        <div class="form-group">
          <label for="nomeProduto">Nome do produto</label>
          <input type="text" id="nomeProduto" required />
        </div>

        <div class="form-group">
          <label for="quantidadeProduto">Quantidade</label>
          <input type="number" id="quantidadeProduto" min="1" required />
        </div>

        <div class="form-group">
          <label for="valorProduto">Valor (R$)</label>
          <input
            type="number"
            id="valorProduto"
            min="0"
            step="0.01"
            required
          />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelarModal">
            Cancelar
          </button>
          <button type="submit" class="btn-primary">
            Salvar produto
          </button>
        </div>
      </form>
    </div>
  </div>


  <footer class="footer">
        <p>© 2025 Corte Verde. Todos os direitos reservados.</p>
    </footer>


  <script src="/Madereira/static/script.js"></script>
</body>
</html>
