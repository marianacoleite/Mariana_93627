<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cedro Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="login-container">
      <!-- Lado esquerdo (Login) -->
      <div class="login-form">
        <h2>Entrar</h2>
        <div class="social-icons">
          <a href="#"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/google.svg" alt="Google"></a>
          <a href="#"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/facebook.svg" alt="Facebook"></a>
          <a href="#"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg" alt="GitHub"></a>
          <a href="#"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/linkedin.svg" alt="LinkedIn"></a>
        </div>
        <p>ou use sua senha de email</p>
        <form>
          <input type="email" placeholder="Email" required>
          <input type="password" placeholder="Password" required>
          <a href="#" class="forgot">Esqueceu sua senha?</a>
          <button type="submit">ENTRAR</button>
        </form>
      </div>

      <!-- Lado direito (Registro) -->
      <div class="register-box">
        <h2>Bem-vindo ao Cedro 🌿</h2>
        <p>Entre com seus dados pessoais para usar todos os recursos do site</p>
        
      </div>
    </div>
  </div>
</body>
</html>
