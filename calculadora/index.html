<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>
<body>

  



    <div class="calculadora">

        <div class="visao">.</div>
        
        <div class="l1">
            <button class="b1">1</button>
            <button class="b2">2</button>
            <button class="b3">3</button>
            <button class="soma">+</button>
        </div>

        <div class="l2">
            <button class="b4">4</button>
            <button class="b5">5</button>
            <button class="b6">6</button>
            <button class="subtracao">-</button>
        </div>

        <div class="l3">
            <button class="b7">7</button>
            <button class="b8">8</button>
            <button class="b9">9</button>
            <button class="multiplicacao">*</button>
        </div>

        <div class="operacao">
            <button class="divisao">/</button>
            <button class="igual">=</button>

        </div>
        

        

    </div>


    <script src="script.js"></script>
</body>
</html>
