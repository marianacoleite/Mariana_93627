<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos - Cedro</title>
  <link rel="stylesheet" href="/Madereira/static/cadastro.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Produtos 🌿</h1>

    <!-- Botão para abrir o formulário -->
    <button id="btnNovoProduto" class="btn">Cadastrar Produto</button>

    <!-- Formulário oculto inicialmente -->
    <form id="formProduto" class="form-produto hidden">
      <h2>Novo Produto</h2>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" required>

      <label for="quantidade">Quantidade:</label>
      <input type="number" id="quantidade" required min="1">

      <label for="valor">Valor (R$):</label>
      <input type="number" id="valor" required step="0.01" min="0">

      <button type="submit" class="btn">Salvar</button>
    </form>

    <!-- Lista de produtos -->
    <h2>Lista de Produtos</h2>
    <table id="tabelaProdutos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Quantidade</th>
          <th>Valor (R$)</th>
        </tr>
      </thead>
      <tbody>
        <!-- Os produtos aparecerão aqui -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
