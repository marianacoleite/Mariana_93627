<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Corte Verde - Login</title>
    
</head>

<style>
    body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to right, #dfe7f1, #cdd6e5);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-repeat: no-repeat;      /* não repetir */
    background-position: center center;/* centralizada */
    background-size: cover;            /* cobre a tela inteira */
    background-attachment: fixed;      /* opcional: efeito de fundo “fixo” */
     background-image: url("{{ url_for('static', filename='img/1239109-3840x2160-desktop-4k-green-forest-wallpaper-photo.jpg') }}");
} 

/* CAIXA CENTRAL */
.container {
    width: 900px;
    height: 450px;
    background: #fff;
    display: flex;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    margin-bottom: 10px;
}

/* LADO ESQUERDO */
.left-box {
    width: 50%;
    padding: 50px;
    text-align: center;
    
    
}

.log{
        
   padding-left: 20px;
    align-items: center;
    justify-content: center;
}


.left-box h2 {
    font-size: 30px;
}

.social-icons {
    margin: 15px 0;
}

.social-icons button {
    width: 40px;
    height: 40px;
    border: 1px solid #ccc;
    border-radius: 50%;
    margin: 0 5px;
    background: none;
    cursor: pointer;
    font-weight: bold;
}

.use-email {
    color: #777;
    font-size: 14px;
    margin: 15px 0;
}

.left-box input {
    margin-top: 10px;
    width: 80%;
    padding: 12px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.forgot {
    display: block;
    margin-top: 12px;
    color: #777;
    font-size: 14px;
    text-decoration: none;
}

.btn-login {
    margin-top: 20px;
    width: 60%;
    padding: 12px;
    background-color: #658C11;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
}

.btn-login:hover {
    background: #275321;
}

#erro {
    color: red;
    margin-top: 10px;
}

/* LADO DIREITO COM A IMAGEM */
.right-box {
    width: 50%;
    background-image: url("{{ url_for('static', filename='img/madeira_rodonda.webp') }}");
    background-size: cover;
    background-position: center;
    position: relative;
}



/* CAMADA ESCURA COM TEXTO */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: rgb(6, 32, 3);
    text-align: center;
}

.overlay h1 {
    font-size: 35px;
    margin-bottom: 10px;
}

.overlay p {
    font-size: 16px;
    margin-bottom: 20px;
}

</style>

<body>
    <div class="container">
        <!-- LADO ESQUERDO - LOGIN -->
        <div class="left-box">
            <div class="log">
                <img src="{{ url_for('static', filename='img/corte.jpg') }}" 
                     class="logo" alt="Logo Corte Verde" width="30%">
            </div>
            
            <p class="use-email">Entrar</p>

            <input type="text" id="usuario" placeholder="Email">
            <input type="password" id="senha" placeholder="Password">

            <a class="forgot" href="#">Esqueceu sua senha?</a>

            <button class="btn-login" onclick="fazerLogin()">ENTRAR</button>

            <p id="erro"></p>
        </div>

        <!-- LADO DIREITO -->
        <div class="right-box">
            <div class="overlay"></div>
        </div>
    </div>

    <!-- SCRIPT DE LOGIN -->
    <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
