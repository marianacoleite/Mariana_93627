<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Forms</title>
</head>
<body>

    <div class="formulario"> 
        <form id="Forms" onsubmit="return validateForm()">

            <H2>Cadastro</H2>

            <label for="name"> Nome:</label>
            <input type="text" id="nome" name="name" placeholder="Digite seu nome">

            <label for="email"> Email:</label>
            <input type="text" id="email" name="email" placeholder="Digite seu email">

            <label for="senha"> <Slot></Slot>Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

            <label for="confirmesenha"> Confirme sua senha:</label>
            <input type="password" id="confirmesenha" name="confirmesenha" placeholder="Confirme sua senha">

            <button type="submit">Cadastrar</button>

            <p id="error"></p>




        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
